openapi: 3.0.3
info:
  title: Social Network Authentication and Posts API
  version: 1.0.0
  description: |
    Contract for the Week 6 authentication exercise. Access tokens are signed JWTs;
    refresh tokens are opaque, single-use credentials. All requests use HTTPS.
    Scopes are listed in x-required-scopes because the locally issued Bearer JWT
    is not an OAuth 2.0 authorization flow.
servers:
  - url: https://api.example.com/v1
tags:
  - name: auth
    description: Issue and renew credentials
  - name: posts
    description: Read private posts
paths:
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Log in with email and password
      description: |
        Public endpoint; no access token or scope is required. Returns an access
        JWT valid for 15 minutes and a single-use refresh token. Login failures
        use the same message for unknown accounts and incorrect passwords.
      security: []
      x-required-scopes: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: an@example.com
              password: example-password
      responses:
        '200':
          description: Credentials issued
          headers:
            Cache-Control:
              description: Credentials must not be cached.
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: invalid_credentials
                message: Invalid email or password.
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: Rotate a refresh token
      description: |
        No access JWT or scope is required; the refresh token in the JSON body
        authenticates this request. On success the old token is invalidated and
        a new token pair is returned. Expired, revoked, or reused refresh tokens
        are rejected. The server stores only a hash of each refresh token.
      security: []
      x-required-scopes: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example:
              refresh_token: rft_example_only
      responses:
        '200':
          description: New credentials issued; the old refresh token is invalid
          headers:
            Cache-Control:
              description: Credentials must not be cached.
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Refresh token is invalid, expired, revoked, or reused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: invalid_refresh_token
                message: Refresh token is invalid or expired.
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /posts/{id}:
    get:
      tags: [posts]
      operationId: getPost
      summary: Read one of the caller's posts
      description: |
        Requires a valid Bearer access JWT containing posts:read. The caller
        must own the post. A post owned by another account returns 404, the
        same as a nonexistent post, to avoid revealing its existence.
      security:
        - bearerAuth: []
      x-required-scopes: [posts:read]
      parameters:
        - name: id
          in: path
          required: true
          description: Post UUID
          schema:
            type: string
            format: uuid
          example: 8fa36a90-1cf1-41d2-925c-44188326534e
      responses:
        '200':
          description: Post belongs to the authenticated caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
              example:
                id: 8fa36a90-1cf1-41d2-925c-44188326534e
                author_id: 777b19e4-ce5f-432c-b153-1896816ce29b
                content: Hello, world!
                created_at: '2026-10-25T08:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Missing, invalid, or expired access JWT
          headers:
            WWW-Authenticate:
              schema:
                type: string
                example: Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: unauthorized
                message: A valid access token is required.
        '403':
          description: Access JWT lacks the posts:read scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: insufficient_scope
                message: The posts:read scope is required.
        '404':
          description: Post does not exist or does not belong to the caller
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: post_not_found
                message: Post not found.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Signed access JWT; refresh tokens cannot be used here.
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          writeOnly: true
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 1
          writeOnly: true
    TokenPair:
      type: object
      additionalProperties: false
      required: [access_token, refresh_token, token_type, expires_in, scope]
      properties:
        access_token:
          type: string
          description: Signed JWT access token
          example: eyJhbGciOi...example
        refresh_token:
          type: string
          description: Opaque, single-use refresh token
          example: rft_example_only
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: Access token lifetime in seconds
          example: 900
        scope:
          type: string
          description: Space-delimited scopes granted to the access JWT
          example: posts:read
    Post:
      type: object
      additionalProperties: false
      required: [id, author_id, content, created_at]
      properties:
        id:
          type: string
          format: uuid
        author_id:
          type: string
          format: uuid
        content:
          type: string
        created_at:
          type: string
          format: date-time
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
  responses:
    BadRequest:
      description: Malformed JSON, missing field, or invalid path parameter
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: invalid_request
            message: Request data is invalid.
    TooManyRequests:
      description: Too many authentication attempts; retry after the stated delay
      headers:
        Retry-After:
          schema:
            type: integer
            example: 60
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: rate_limited
            message: Try again later.
