openapi: 3.0.3
info:
  title: Lab 1 - User API Versioning
  version: 2.0.0
  description: URI path versioning with Flask Blueprints. Both versions share in-memory user data. The
    v1 Sunset header announces a planned shutdown; it does not automatically disable the endpoint.
servers:
- url: /
paths:
  /api/v1/users/{uid}:
    get:
      operationId: getUserV1
      summary: Get a user with the v1 full_name schema
      tags:
      - v1
      parameters:
      - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User found
          headers:
            Sunset:
              $ref: '#/components/headers/Sunset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserV1'
              example:
                id: 1
                full_name: Văn Nguyễn
                email: a@vnu.vn
        '404':
          description: User not found
          headers:
            Sunset:
              $ref: '#/components/headers/Sunset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: nf
  /api/v2/users/{uid}:
    get:
      operationId: getUserV2
      summary: Get a user with separate first_name and last_name
      tags:
      - v2
      parameters:
      - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserV2'
              example:
                id: 1
                first_name: Văn
                last_name: Nguyễn
                email: a@vnu.vn
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: nf
  /api/v2/users:
    post:
      operationId: createUserV2
      summary: Create a user
      description: Requires three string fields with at least one non-whitespace character. Leading and
        trailing whitespace is removed before storage. Extra fields are ignored. Email syntax is not validated.
        Data is lost when the server restarts.
      tags:
      - v2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUser'
            example:
              first_name: An
              last_name: Lê
              email: an@vnu.vn
      responses:
        '201':
          description: User created; the same user is also available through v1
          headers:
            Location:
              description: Relative URL of the created v2 user
              schema:
                type: string
              example: /api/v2/users/3
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserV2'
              example:
                id: 3
                first_name: An
                last_name: Lê
                email: an@vnu.vn
        '400':
          description: Malformed JSON, a non-object body, or missing, non-string or whitespace-only required
            fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidBody:
                  value:
                    error: JSON body must be an object
                invalidFields:
                  value:
                    error: first_name, last_name and email must be non-empty strings
        '415':
          description: Content-Type is not application/json or application/*+json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Content-Type must be application/json
components:
  parameters:
    UserId:
      name: uid
      in: path
      required: true
      description: User ID
      schema:
        type: integer
        minimum: 0
      example: 1
  headers:
    Sunset:
      description: Planned v1 shutdown time as an HTTP date. This header is informational; no automatic
        shutdown is implemented.
      schema:
        type: string
      example: Thu, 31 Dec 2026 23:59:59 GMT
  schemas:
    UserV1:
      type: object
      required:
      - id
      - full_name
      - email
      properties:
        id:
          type: integer
        full_name:
          type: string
        email:
          type: string
    UserV2:
      type: object
      required:
      - id
      - first_name
      - last_name
      - email
      properties:
        id:
          type: integer
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
    CreateUser:
      type: object
      required:
      - first_name
      - last_name
      - email
      properties:
        first_name:
          type: string
          minLength: 1
          pattern: \S
        last_name:
          type: string
          minLength: 1
          pattern: \S
        email:
          type: string
          minLength: 1
          pattern: \S
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: string
